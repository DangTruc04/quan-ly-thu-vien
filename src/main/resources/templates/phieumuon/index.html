<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">

<head>
    <meta charset="UTF-8">
    <title>Quản lý phiếu mượn</title>
</head>

<body>

<section layout:fragment="content">
    <!-- Content -->
    <div class="content container-fluid">
        <div th:if="${msg}" class="alert alert-soft-success" th:text="${msg}"></div>
        <div th:if="${errorMsg}" class="alert alert-soft-danger" th:text="${errorMsg}"></div>

        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-end">
                <div class="col-sm mb-2 mb-sm-0">
                    <h1 class="page-header-title">Quản lý phiếu mượn</h1>
                </div>

                <div class="col-sm-auto">
                    <a class="btn btn-primary" th:href="@{/phieumuon/them}">
                        <i class="tio-add mr-1"></i> Thêm phiếu mượn
                    </a>
                </div>
            </div>
            <!-- End Row -->
        </div>
        <!-- End Page Header -->

        <!-- Card -->
        <div class="card">
            <!-- Table -->
            <div class="table-responsive datatable-custom">
                <table id="datatable" class="table table-lg table-borderless table-thead-bordered table-nowrap table-align-middle card-table" data-hs-datatables-options='{
                         "columnDefs": [{
                            "targets": [0, 7],
                            "orderable": false
                          }],
                         "order": [],
                         "info": {
                           "totalQty": "#datatableWithPaginationInfoTotalQty"
                         },
                         "search": "#datatableSearch",
                         "entries": "#datatableEntries",
                         "pageLength": 15,
                         "isResponsive": false,
                         "isShowPaging": false,
                         "pagination": "datatablePagination"
                       }'>
                    <thead class="thead-light">
                        <tr>
                            <th>Mã phiếu</th>
                            <th class="text-center">Sinh viên</th>
                            <th>Ngày lập</th>
                            <th>Hạn trả</th>
                            <th class="text-center">Số sách</th>
                            <th class="text-center">Tổng số lượng</th>
                            <th class="text-center">Thời hạn</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="pm : ${listPhieuMuon}"
                            th:classappend="${!phieuDaTra.contains(pm.maphieumuon) and pm.soNgayConLai != null and pm.soNgayConLai < 0} ? 'table-danger' : ''">
                            <td class="text-center">
                                <span class="d-block h5 text-hover-primary mb-0" th:text="${pm.maphieumuon}"></span>
                            </td>
                            <td th:text="${pm.sinhVien != null ? pm.sinhVien.masv + ' - ' + pm.sinhVien.tensv : ''}"></td>
                            <td th:text="${pm.ngaylap != null ? pm.ngaylap.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></td>
                            <td>
                                <span th:if="${pm.ngayhentra != null}"
                                      th:text="${pm.ngayhentra.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy'))}"></span>
                            </td>
                            <td class="text-center"
                                th:text="${pm.chiTietPhieuMuons != null ? #lists.size(pm.chiTietPhieuMuons) : 0}"></td>
                            <td class="text-center"
                                th:text="${pm.chiTietPhieuMuons == null or #lists.isEmpty(pm.chiTietPhieuMuons) ? 0 : #aggregates.sum(pm.chiTietPhieuMuons.![soluongmuon])}"></td>
                            <td class="text-center">
                                <span th:if="${phieuDaTra.contains(pm.maphieumuon)}"
                                      class="badge badge-soft-primary">
                                    <i class="tio-checkmark-circle mr-1"></i>Đã trả
                                </span>
                                <span th:if="${!phieuDaTra.contains(pm.maphieumuon) and pm.soNgayConLai != null}"
                                      class="badge"
                                      th:classappend="${pm.soNgayConLai < 0 ? 'badge-soft-danger' : (pm.soNgayConLai <= 2 ? 'badge-soft-warning' : 'badge-soft-success')}"
                                      th:title="${pm.soNgayConLai < 0 ? 'Phiếu mượn đã quá hạn' : 'Số ngày còn lại có thể mượn'}">
                                    <i class="tio-clock mr-1"></i>
                                    <span th:if="${pm.soNgayConLai < 0}"
                                          th:text="${'Quá hạn ' + (-pm.soNgayConLai) + ' ngày'}"></span>
                                    <span th:if="${pm.soNgayConLai == 0}">Hết hạn hôm nay</span>
                                    <span th:if="${pm.soNgayConLai > 0}"
                                          th:text="${'Còn ' + pm.soNgayConLai + ' ngày'}"></span>
                                </span>
                            </td>
                            <td>
                                <a class="btn btn-sm btn-white" th:href="@{/phieumuon/sua/{id}(id=${pm.maphieumuon})}">
                                    <i class="tio-edit"></i> Sửa
                                </a>
                                <a th:if="${!phieuDaTra.contains(pm.maphieumuon)}" class="btn btn-sm btn-primary"
                                   th:href="@{/phieutra/them(maphieumuon=${pm.maphieumuon})}">Trả sách</a>
                                <a th:if="${phieuDaTra.contains(pm.maphieumuon)}" class="btn btn-sm btn-white"
                                   th:href="@{/phieutra}">Phiếu trả</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- End Table -->

            <!-- Footer -->
            <div class="card-footer">
                <!-- Pagination -->
                <div class="row justify-content-center justify-content-sm-between align-items-sm-center">
                    <div class="col-sm mb-2 mb-sm-0">
                        <div class="d-flex justify-content-center justify-content-sm-start align-items-center">
                            <span class="mr-2">Showing:</span>

                            <!-- Select -->
                            <select id="datatableEntries" class="js-select2-custom" data-hs-select2-options='{
                                    "minimumResultsForSearch": "Infinity",
                                    "customClass": "custom-select custom-select-sm custom-select-borderless",
                                    "dropdownAutoWidth": true,
                                    "width": true
                                  }'>
                                <option value="10">10</option>
                                <option value="15" selected="">15</option>
                                <option value="20">20</option>
                            </select>
                            <!-- End Select -->

                            <span class="text-secondary mr-2">of</span>

                            <!-- Pagination Quantity -->
                            <span id="datatableWithPaginationInfoTotalQty"></span>
                        </div>
                    </div>

                    <div class="col-sm-auto">
                        <div class="d-flex justify-content-center justify-content-sm-end">
                            <!-- Pagination -->
                            <nav id="datatablePagination" aria-label="Activity pagination"></nav>
                        </div>
                    </div>
                </div>
                <!-- End Pagination -->
            </div>
            <!-- End Footer -->
        </div>
        <!-- End Card -->
    </div>
    <!-- End Content -->

    <script>
        setTimeout(() => document.querySelectorAll('.alert-soft-success, .alert-soft-danger').forEach(e => e.remove()), 3000);
    </script>
</section>

</body>
</html>
