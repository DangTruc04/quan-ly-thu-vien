<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Quản Lý Thư Viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h3 class="mb-0"><i class="fas fa-user-plus me-2"></i>Đăng Ký Tài Khoản</h3>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>Đăng ký không thành công! Vui lòng thử lại.
                        </div>
                        <form action="/register" method="post" th:object="${sinhVien}">
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-2"></i>Tên đăng nhập
                                </label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required placeholder="Nhập tên đăng nhập">
                            </div>
                            <div class="mb-3">
                                <label for="tensv" class="form-label">
                                    <i class="fas fa-user me-2"></i>Họ và Tên
                                </label>
                                <input type="text" class="form-control" id="tensv" th:field="*{tensv}" required placeholder="Nhập họ và tên">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-2"></i>Email
                                </label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Nhập email">
                            </div>
                            <div class="mb-3">
                                <label for="sdt" class="form-label">
                                    <i class="fas fa-phone me-2"></i>Số Điện Thoại
                                </label>
                                <input type="text" class="form-control" id="sdt" th:field="*{sdt}" placeholder="Nhập số điện thoại">
                            </div>
                            <div class="mb-3">
                                <label for="lop" class="form-label">
                                    <i class="fas fa-graduation-cap me-2"></i>Lớp
                                </label>
                                <input type="text" class="form-control" id="lop" th:field="*{lop}" placeholder="Nhập lớp">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Mật Khẩu
                                </label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" required placeholder="Nhập mật khẩu">
                            </div>
                            <button type="submit" class="btn btn-borrow w-100 py-2">
                                <i class="fas fa-user-plus me-2"></i>Đăng Ký
                            </button>
                        </form>
                        <hr class="my-4">
                        <p class="text-center mb-2">
                            Đã có tài khoản? <a href="/login" class="text-primary">Đăng nhập ngay</a>
                        </p>
                        <p class="text-center">
                            <a href="/login" class="text-muted"><i class="fas fa-arrow-left me-1"></i>Quay lại trang đăng nhập</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
