<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mượn Sách - Thư Viện Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện Online
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/my-borrows"><i class="fas fa-book-reader me-1"></i>Phiếu Mượn</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h3 class="mb-0"><i class="fas fa-hand-holding me-2"></i>Xác Nhận Mượn Sách</h3>
                    </div>
                    <div class="card-body p-4">
                        <div class="row">
                            <div class="col-md-4 text-center mb-3">
                                <img th:src="${book.imageUrl ?: 'https://via.placeholder.com/200x300?text=No+Image'}" 
                                     class="img-fluid rounded shadow" alt="Book Cover" style="max-height: 300px;">
                            </div>
                            <div class="col-md-8">
                                <h4 class="mb-3" th:text="${book.title}">Book Title</h4>
                                <div class="mb-3">
                                    <p class="mb-2">
                                        <i class="fas fa-tag me-2 text-primary"></i>
                                        <strong>Giá:</strong> 
                                        <span class="text-primary fw-bold" th:text="${#numbers.formatDecimal(book.price, 0, 0)} + ' VNĐ'">Price</span>
                                    </p>
                                    <p class="mb-2" th:if="${book.originalPrice}">
                                        <i class="fas fa-tag me-2 text-muted"></i>
                                        <strong>Giá gốc:</strong> 
                                        <span class="text-muted text-decoration-line-through" th:text="${#numbers.formatDecimal(book.originalPrice, 0, 0)} + ' VNĐ'">Original Price</span>
                                    </p>
                                    <p class="mb-2">
                                        <i class="fas fa-folder me-2 text-info"></i>
                                        <strong>Phân loại:</strong> 
                                        <span th:text="${book.category?.name}">Category</span>
                                    </p>
                                    <p class="mb-2">
                                        <i class="fas fa-user me-2 text-info"></i>
                                        <strong>Tác giả:</strong> 
                                        <span th:text="${book.author?.name}">Author</span>
                                    </p>
                                    <p class="mb-2">
                                        <i class="fas fa-cubes me-2 text-success"></i>
                                        <strong>Số lượng còn:</strong> 
                                        <span class="badge bg-success" th:text="${book.quantity}">Quantity</span>
                                    </p>
                                </div>
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle me-2"></i>
                                    Thời gian mượn tối đa: 14 ngày
                                </div>
                                <form action="/borrow" method="post">
                                    <input type="hidden" name="bookId" th:value="${book.id}">
                                    <button type="submit" class="btn btn-borrow me-2">
                                        <i class="fas fa-check me-2"></i>Xác Nhận Mượn
                                    </button>
                                    <a href="/" class="btn btn-secondary">
                                        <i class="fas fa-times me-2"></i>Hủy
                                    </a>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
