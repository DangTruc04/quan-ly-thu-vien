<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${sinhVien.masv ? 'Sửa Sinh Viên' : 'Thêm Sinh Viên'}">Form Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/sinh-vien"><i class="fas fa-users me-1"></i>Sinh Viên</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>
                            <span th:text="${sinhVien.masv ? 'Sửa Sinh Viên' : 'Thêm Sinh Viên'}">Form</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/sinh-vien/save}" method="post" th:object="${sinhVien}">
                            <input type="hidden" th:field="*{masv}" th:if="${sinhVien.masv}">
                            
                            <div class="mb-3">
                                <label for="tensv" class="form-label">
                                    <i class="fas fa-user me-2"></i>Họ Tên Sinh Viên
                                </label>
                                <input type="text" class="form-control" id="tensv" th:field="*{tensv}" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-2"></i>Email
                                </label>
                                <input type="email" class="form-control" id="email" th:field="*{email}">
                            </div>

                            <div class="mb-3">
                                <label for="sdt" class="form-label">
                                    <i class="fas fa-phone me-2"></i>Số Điện Thoại
                                </label>
                                <input type="text" class="form-control" id="sdt" th:field="*{sdt}">
                            </div>

                            <div class="mb-3">
                                <label for="lop" class="form-label">
                                    <i class="fas fa-graduation-cap me-2"></i>Lớp
                                </label>
                                <input type="text" class="form-control" id="lop" th:field="*{lop}">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-borrow">
                                    <i class="fas fa-save me-2"></i>Lưu
                                </button>
                                <a href="/admin/sinh-vien" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Hủy
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
