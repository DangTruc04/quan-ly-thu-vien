<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/sach"><i class="fas fa-book me-1"></i>Sách</a>
                <a class="nav-link" href="/admin/loai-sach"><i class="fas fa-tags me-1"></i>Loại Sách</a>
                <a class="nav-link active" href="/admin/sinh-vien"><i class="fas fa-users me-1"></i>Sinh Viên</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-0">
                <i class="fas fa-users me-2"></i>Quản Lý Sinh Viên
            </h2>
            <a href="/admin/sinh-vien/add" class="btn btn-borrow">
                <i class="fas fa-plus me-2"></i>Thêm Sinh Viên
            </a>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th><i class="fas fa-hashtag me-2"></i>Mã SV</th>
                                <th><i class="fas fa-user me-2"></i>Họ Tên</th>
                                <th><i class="fas fa-envelope me-2"></i>Email</th>
                                <th><i class="fas fa-phone me-2"></i>SĐT</th>
                                <th><i class="fas fa-graduation-cap me-2"></i>Lớp</th>
                                <th><i class="fas fa-cog me-2"></i>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sv : ${sinhViens}">
                                <td th:text="${sv.masv}">Mã SV</td>
                                <td th:text="${sv.tensv}">Họ Tên</td>
                                <td th:text="${sv.email ?: '-'}">Email</td>
                                <td th:text="${sv.sdt ?: '-'}">SĐT</td>
                                <td th:text="${sv.lop ?: '-'}">Lớp</td>
                                <td>
                                    <a th:href="@{/admin/sinh-vien/edit/{masv}(masv=${sv.masv})}" 
                                       class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/admin/sinh-vien/delete/{masv}(masv=${sv.masv})}" 
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Bạn có chắc muốn xóa?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
