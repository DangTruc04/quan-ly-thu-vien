<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${loaiSach.maloai ? 'Sửa Loại Sách' : 'Thêm Loại Sách'}">Form Loại Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/loai-sach"><i class="fas fa-tags me-1"></i>Loại Sách</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-tags me-2"></i>
                            <span th:text="${loaiSach.maloai ? 'Sửa Loại Sách' : 'Thêm Loại Sách'}">Form</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/loai-sach/save}" method="post" th:object="${loaiSach}">
                            <input type="hidden" th:field="*{maloai}" th:if="${loaiSach.maloai}">
                            
                            <div class="mb-3">
                                <label for="tenloai" class="form-label">
                                    <i class="fas fa-tag me-2"></i>Tên Loại Sách
                                </label>
                                <input type="text" class="form-control" id="tenloai" th:field="*{tenloai}" required>
                            </div>

                            <div class="mb-3">
                                <label for="trangthai" class="form-label">
                                    <i class="fas fa-info-circle me-2"></i>Trạng Thái
                                </label>
                                <select class="form-select" id="trangthai" th:field="*{trangthai}">
                                    <option value="Active">Hoạt Động</option>
                                    <option value="Inactive">Ngừng Hoạt Động</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-borrow">
                                    <i class="fas fa-save me-2"></i>Lưu
                                </button>
                                <a href="/admin/loai-sach" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Hủy
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
