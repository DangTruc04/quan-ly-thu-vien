<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Loại Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/sach"><i class="fas fa-book me-1"></i>Sách</a>
                <a class="nav-link active" href="/admin/loai-sach"><i class="fas fa-tags me-1"></i>Loại Sách</a>
                <a class="nav-link" href="/admin/sinh-vien"><i class="fas fa-users me-1"></i>Sinh Viên</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-0">
                <i class="fas fa-tags me-2"></i>Quản Lý Loại Sách
            </h2>
            <a href="/admin/loai-sach/add" class="btn btn-borrow">
                <i class="fas fa-plus me-2"></i>Thêm Loại Sách
            </a>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th><i class="fas fa-hashtag me-2"></i>Mã Loại</th>
                                <th><i class="fas fa-tag me-2"></i>Tên Loại</th>
                                <th><i class="fas fa-info-circle me-2"></i>Trạng Thái</th>
                                <th><i class="fas fa-cog me-2"></i>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="loai : ${loaiSachs}">
                                <td th:text="${loai.maloai}">Mã Loại</td>
                                <td th:text="${loai.tenloai}">Tên Loại</td>
                                <td>
                                    <span class="badge bg-success" th:if="${loai.trangthai == 'Active'}">Hoạt Động</span>
                                    <span class="badge bg-danger" th:if="${loai.trangthai == 'Inactive'}">Ngừng Hoạt Động</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/loai-sach/edit/{maloai}(maloai=${loai.maloai})}" 
                                       class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/admin/loai-sach/delete/{maloai}(maloai=${loai.maloai})}" 
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Bạn có chắc muốn xóa?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
