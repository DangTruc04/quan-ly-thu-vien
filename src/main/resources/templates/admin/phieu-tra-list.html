<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phiếu Trả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/sach"><i class="fas fa-book me-1"></i>Sách</a>
                <a class="nav-link" href="/admin/loai-sach"><i class="fas fa-tags me-1"></i>Loại Sách</a>
                <a class="nav-link" href="/admin/sinh-vien"><i class="fas fa-users me-1"></i>Sinh Viên</a>
                <a class="nav-link" href="/admin/phieu-muon"><i class="fas fa-file-alt me-1"></i>Phiếu Mượn</a>
                <a class="nav-link active" href="/admin/phieu-tra"><i class="fas fa-undo me-1"></i>Phiếu Trả</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="section-title">
            <i class="fas fa-undo me-2"></i>Quản Lý Phiếu Trả
        </h2>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th><i class="fas fa-hashtag me-2"></i>Mã Phiếu Trả</th>
                                <th><i class="fas fa-calendar me-2"></i>Ngày Trả</th>
                                <th><i class="fas fa-file-alt me-2"></i>Mã Phiếu Mượn</th>
                                <th><i class="fas fa-eye me-2"></i>Chi Tiết</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pt : ${phieuTras}">
                                <td th:text="${pt.maphieutra}">Mã Phiếu Trả</td>
                                <td th:text="${pt.ngaylap}">Ngày Trả</td>
                                <td th:text="${pt.phieuMuon?.maphieumuon}">Mã Phiếu Mượn</td>
                                <td>
                                    <a th:href="@{/admin/phieu-tra/view/{maphieutra}(maphieutra=${pt.maphieutra})}" 
                                       class="btn btn-sm btn-info">
                                        <i class="fas fa-eye"></i> Xem
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
