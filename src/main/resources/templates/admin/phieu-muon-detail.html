<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Phiếu Mượn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/phieu-muon"><i class="fas fa-file-alt me-1"></i>Phiếu Mượn</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-file-alt me-2"></i>Chi Tiết Phiếu Mượn
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <p><strong>Mã Phiếu:</strong> <span th:text="${phieuMuon.maphieumuon}">Mã</span></p>
                                <p><strong>Ngày Lập:</strong> <span th:text="${phieuMuon.ngaylap}">Ngày</span></p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Sinh Viên:</strong> <span th:text="${phieuMuon.sinhVien?.tensv}">Tên SV</span></p>
                                <p><strong>Mã SV:</strong> <span th:text="${phieuMuon.sinhVien?.masv}">Mã SV</span></p>
                            </div>
                        </div>

                        <h5 class="mb-3">Danh Sách Sách Mượn</h5>
                        <table class="table table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th>Tên Sách</th>
                                    <th>Số Lượng Mượn</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ct : ${phieuMuon.chiTietPhieuMuons}">
                                    <td th:text="${ct.sach?.tensach}">Tên Sách</td>
                                    <td th:text="${ct.soluongmuon}">Số Lượng</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="d-flex gap-2 mt-4">
                            <a th:href="@{/admin/phieu-tra/add/{maphieumuon}(maphieumuon=${phieuMuon.maphieumuon})}" 
                               class="btn btn-success">
                                <i class="fas fa-undo me-2"></i>Tạo Phiếu Trả
                            </a>
                            <a href="/admin/phieu-muon" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Quay Lại
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
