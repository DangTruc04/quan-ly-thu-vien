<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Phiếu Mượn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/phieu-muon"><i class="fas fa-file-alt me-1"></i>Phiếu Mượn</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-file-alt me-2"></i>Tạo Phiếu Mượn
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/phieu-muon/save}" method="post">
                            <div class="mb-3">
                                <label for="masv" class="form-label">
                                    <i class="fas fa-user me-2"></i>Chọn Sinh Viên
                                </label>
                                <select class="form-select" id="masv" name="masv" required>
                                    <option value="">-- Chọn Sinh Viên --</option>
                                    <option th:each="sv : ${sinhViens}" 
                                            th:value="${sv.masv}"
                                            th:text="${sv.masv + ' - ' + sv.tensv}">Sinh Viên</option>
                                </select>
                            </div>

                            <hr>
                            <h5 class="mb-3">
                                <i class="fas fa-book me-2"></i>Chọn Sách Mượn
                            </h5>

                            <div id="bookList">
                                <div th:each="sach : ${sachs}" class="book-item mb-3 p-3 border rounded">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" 
                                               th:id="'book-' + ${sach.masach}" 
                                               th:value="${sach.masach}" 
                                               name="sachIds">
                                        <label class="form-check-label" th:for="'book-' + ${sach.masach}">
                                            <strong th:text="${sach.tensach}">Tên Sách</strong>
                                            <span class="text-muted ms-2" th:text="'(Còn: ' + ${sach.soluong} + ')'">Số lượng</span>
                                        </label>
                                    </div>
                                    <div class="mt-2 ms-4">
                                        <label>Số lượng mượn:</label>
                                        <input type="number" class="form-control form-control-sm" 
                                               style="width: 100px; display: inline-block;"
                                               th:name="'soLuongs'" 
                                               min="1" 
                                               th:max="${sach.soluong}"
                                               value="1">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-borrow">
                                    <i class="fas fa-save me-2"></i>Tạo Phiếu Mượn
                                </button>
                                <a href="/admin/phieu-muon" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Hủy
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
