<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/sach"><i class="fas fa-book me-1"></i>Sách</a>
                <a class="nav-link" href="/admin/loai-sach"><i class="fas fa-tags me-1"></i>Loại Sách</a>
                <a class="nav-link" href="/admin/sinh-vien"><i class="fas fa-users me-1"></i>Sinh Viên</a>
                <a class="nav-link" href="/admin/phieu-muon"><i class="fas fa-file-alt me-1"></i>Phiếu Mượn</a>
                <a class="nav-link" href="/admin/phieu-tra"><i class="fas fa-undo me-1"></i>Phiếu Trả</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-0">
                <i class="fas fa-book me-2"></i>Quản Lý Sách
            </h2>
            <a href="/admin/sach/add" class="btn btn-borrow">
                <i class="fas fa-plus me-2"></i>Thêm Sách Mới
            </a>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th><i class="fas fa-image me-2"></i>Hình</th>
                                <th><i class="fas fa-book me-2"></i>Tiêu Đề</th>
                                <th><i class="fas fa-tags me-2"></i>Loại Sách</th>
                                <th><i class="fas fa-user me-2"></i>Tác Giả</th>
                                <th><i class="fas fa-money-bill me-2"></i>Giá</th>
                                <th><i class="fas fa-cubes me-2"></i>Số Lượng</th>
                                <th><i class="fas fa-redo me-2"></i>Tái Bản</th>
                                <th><i class="fas fa-info-circle me-2"></i>Trạng Thái</th>
                                <th><i class="fas fa-cog me-2"></i>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sach : ${sachs}">
                                <td>
                                    <img th:src="${sach.imageUrl ?: 'https://via.placeholder.com/50x75?text=Book'}" 
                                         class="rounded" alt="Book" style="width: 50px; height: 75px; object-fit: cover;">
                                </td>
                                <td th:text="${sach.tensach}">Tiêu Đề</td>
                                <td th:text="${sach.loaiSach?.tenloai}">Loại Sách</td>
                                <td th:text="${sach.author?.name}">Tác Giả</td>
                                <td th:text="${sach.gia != null ? #numbers.formatDecimal(sach.gia, 0, 0) + ' VNĐ' : '-'}">Giá</td>
                                <td th:text="${sach.soluong}">Số Lượng</td>
                                <td th:text="${sach.taiban}">Tái Bản</td>
                                <td>
                                    <span class="badge bg-success" th:if="${sach.trangthai == 'Available'}">Có Sách</span>
                                    <span class="badge bg-danger" th:if="${sach.trangthai == 'Unavailable'}">Hết Sách</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/sach/edit/{masach}(masach=${sach.masach})}" 
                                       class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/admin/sach/delete/{masach}(masach=${sach.masach})}" 
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Bạn có chắc muốn xóa?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
