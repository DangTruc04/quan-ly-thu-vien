<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Phiếu Trả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-open me-2"></i>Thư Viện
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Trang Chủ</a>
                <a class="nav-link" href="/admin/phieu-tra"><i class="fas fa-undo me-1"></i>Phiếu Trả</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-undo me-2"></i>Chi Tiết Phiếu Trả
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <p><strong>Mã Phiếu Trả:</strong> <span th:text="${phieuTra.maphieutra}">Mã</span></p>
                                <p><strong>Ngày Trả:</strong> <span th:text="${phieuTra.ngaylap}">Ngày</span></p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Mã Phiếu Mượn:</strong> <span th:text="${phieuTra.phieuMuon?.maphieumuon}">Mã PM</span></p>
                                <p><strong>Ngày Mượn:</strong> <span th:text="${phieuTra.phieuMuon?.ngaylap}">Ngày Mượn</span></p>
                            </div>
                        </div>

                        <div class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            Sách đã được trả thành công!
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <a href="/admin/phieu-tra" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Quay Lại
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
