<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">

<head>
    <meta charset="UTF-8">
    <title>Thêm sinh viên</title>
</head>

<body>

<section layout:fragment="content">
    <div class="content container-fluid">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col-sm mb-2 mb-sm-0">
                    <h1 class="page-header-title">Thêm sinh viên</h1>
                </div>
            </div>
        </div>

        <div class="row justify-content-lg-center">
            <div class="col-lg-8">
                <div class="card card-lg">
                    <form th:action="@{/sinhvien/them}" th:object="${sinhVien}" method="post">
                        <div class="card-body">
                            <div th:if="${error}" class="alert alert-soft-danger" th:text="${error}"></div>

                            <div class="row form-group">
                                <label for="masv" class="col-sm-3 col-form-label input-label">Mã sinh viên</label>
                                <div class="col-sm-9">
                                    <input type="number" class="form-control" id="masv"
                                           th:field="*{masv}" placeholder="Nhập mã sinh viên">
                                </div>
                            </div>

                            <div class="row form-group">
                                <label for="tensv" class="col-sm-3 col-form-label input-label">Họ tên sinh viên</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="tensv"
                                           th:field="*{tensv}" placeholder="Nguyễn Văn A">
                                </div>
                            </div>
                        </div>

                        <div class="card-footer d-flex justify-content-between align-items-center">
                            <a class="btn btn-danger" th:href="@{/sinhvien}">
                                <i class="tio-chevron-left"></i> Trở về
                            </a>
                            <button type="submit" class="btn btn-primary">
                                Thêm <i class="tio-add"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
