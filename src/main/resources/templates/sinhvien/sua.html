<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">

<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa sinh viên</title>
</head>

<body>

<section layout:fragment="content">
    <div class="content container-fluid">
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col-sm mb-2 mb-sm-0">
                    <h1 class="page-header-title">Chỉnh sửa sinh viên</h1>
                </div>
            </div>
        </div>

        <div class="row justify-content-lg-center">
            <div class="col-lg-8">
                <div class="card card-lg">
                    <form th:action="@{/sinhvien/sua/{id}(id=${sinhVien.masv})}"
                          th:object="${sinhVien}" method="post">
                        <div class="card-body">
                            <div th:if="${error}" class="alert alert-soft-danger" th:text="${error}"></div>

                            <div class="row form-group">
                                <label for="masv" class="col-sm-3 col-form-label input-label">Mã sinh viên</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="masv"
                                           th:value="${sinhVien.masv}" readonly>
                                </div>
                            </div>

                            <div class="row form-group">
                                <label for="tensv" class="col-sm-3 col-form-label input-label">Họ tên sinh viên</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="tensv"
                                           th:field="*{tensv}" placeholder="Nguyễn Văn A">
                                </div>
                            </div>
                        </div>

                        <div class="card-footer d-flex justify-content-between align-items-center">
                            <a class="btn btn-danger" th:href="@{/sinhvien}">
                                <i class="tio-chevron-left"></i> Trở về
                            </a>

                            <div class="d-flex align-items-center">
                                <button type="submit" class="btn btn-danger mr-2"
                                        th:formaction="@{/sinhvien/xoa/{id}(id=${sinhVien.masv})}"
                                        formmethod="post"
                                        onclick="return confirm('Bạn chắc chắn muốn xóa sinh viên này?');">
                                    Xóa <i class="tio-delete-outlined"></i>
                                </button>

                                <button type="submit" class="btn btn-primary">
                                    Lưu <i class="tio-save"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
